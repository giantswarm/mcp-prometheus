# OAuth credentials checksum tests for the mcp-prometheus Helm chart
#
# The server reads its OAuth credentials (the client secret, the token
# encryption key, the Valkey password) from a Secret at start and never again.
# The pod template's checksum/oauth-secret annotation restarts it when they
# change: the SHA-256 of the chart-rendered Secret's data, or
# app.oauth.existingSecretChecksum verbatim for a Secret the chart does not
# render. The pinned hashes are the SHA-256 of the Secret's data lines exactly
# as the chart renders them (key: base64 value, one per line); a change to
# that text rolls every installation on the next chart release.
#
# Run with: helm unittest ./helm/mcp-prometheus

suite: OAuth credentials checksum
templates:
  - templates/deployment.yaml
  - templates/oauth-secret.yaml
release:
  name: mcp-prometheus
  namespace: mcp-prometheus
tests:
  - it: renders no pod annotations while OAuth is off
    template: templates/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.metadata.annotations

  - it: hashes the data of the Secret it renders
    set:
      app.oauth.enabled: true
      app.oauth.dexClientSecret: dex-secret-1
      app.oauth.encryptionKey: key-1
      app.oauth.storage.valkey.password: valkey-1
    asserts:
      - template: templates/deployment.yaml
        equal:
          path: spec.template.metadata.annotations["checksum/oauth-secret"]
          value: 2d7d827e9ffdaf6a518fe03106d7a288f2e17efa031e74598327d72bec4750c3
      - template: templates/oauth-secret.yaml
        equal:
          path: data
          value:
            DEX_CLIENT_SECRET: ZGV4LXNlY3JldC0x
            MCP_OAUTH_ENCRYPTION_KEY: a2V5LTE=
            VALKEY_PASSWORD: dmFsa2V5LTE=

  - it: changes the checksum with a rotated credential
    template: templates/deployment.yaml
    set:
      app.oauth.enabled: true
      app.oauth.dexClientSecret: dex-secret-2
      app.oauth.encryptionKey: key-1
      app.oauth.storage.valkey.password: valkey-1
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/oauth-secret"]
          value: 4de0cb9e11d72d95c4d6298bff8944e27a06e04febc399c084d10a5862c57b2d

  - it: keeps podAnnotations beside the checksum
    template: templates/deployment.yaml
    set:
      podAnnotations:
        example.com/owner: atlas
      app.oauth.enabled: true
      app.oauth.dexClientSecret: dex-secret-1
      app.oauth.encryptionKey: key-1
    asserts:
      - equal:
          path: spec.template.metadata.annotations["example.com/owner"]
          value: atlas
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/oauth-secret"]
          pattern: ^[0-9a-f]{64}$

  - it: renders existingSecretChecksum verbatim for a Secret it does not render
    set:
      app.oauth.enabled: true
      app.oauth.existingSecret: mcp-prometheus-oauth-credentials
      app.oauth.existingSecretChecksum: "2026-09-22T16:33:54Z"
    asserts:
      - template: templates/deployment.yaml
        equal:
          path: spec.template.metadata.annotations["checksum/oauth-secret"]
          value: "2026-09-22T16:33:54Z"
      - template: templates/deployment.yaml
        contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: mcp-prometheus-oauth-credentials
      - template: templates/oauth-secret.yaml
        hasDocuments:
          count: 0

  - it: renders no checksum for an existing Secret without a revision mark
    template: templates/deployment.yaml
    set:
      app.oauth.enabled: true
      app.oauth.existingSecret: mcp-prometheus-oauth-credentials
    asserts:
      - notExists:
          path: spec.template.metadata.annotations
