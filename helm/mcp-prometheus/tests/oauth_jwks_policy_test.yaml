suite: OAuth JWKS address policy
templates:
  - templates/deployment.yaml
set:
  app.oauth.enabled: true
  app.oauth.dexClientSecret: dex-secret
  app.oauth.encryptionKey: encryption-key
tests:
  - it: renders the JWKS value false by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MCP_OAUTH_ALLOW_PRIVATE_IP_JWKS
            value: "false"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MCP_OAUTH_ALLOW_PRIVATE_URLS
            value: "false"
  - it: still renders the deprecated JWKS value
    set:
      app.oauth.allowPrivateIPJWKS: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MCP_OAUTH_ALLOW_PRIVATE_IP_JWKS
            value: "true"
  - it: still renders the deprecated alias as the JWKS value
    set:
      app.oauth.allowPrivateURLs: true
      app.oauth.allowPrivateIPJWKS: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MCP_OAUTH_ALLOW_PRIVATE_IP_JWKS
            value: "true"
