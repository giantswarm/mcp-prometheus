# app-test-suite (ATS >= 1.0) config for the generated execute-chart-tests job,
# which creates the kind cluster itself; the ATS 0.x `*-cluster-type` keys are
# unknown to ATS 1.x and fail the job ("unrecognized arguments").
app-tests-app-config-file: tests/test-values.yaml
app-tests-deploy-namespace: mcp-prometheus

skip-steps: [functional, upgrade]
